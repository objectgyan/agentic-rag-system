name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Known-vulnerable runtime dependencies fail the build (dev-only tooling is not shipped).
      - run: npm audit --omit=dev --audit-level=moderate
      # `npm run build` typechecks the app and vite.config.ts, then runs `vite build`.
      - run: npm run build

  helm:
    name: Helm chart (lint + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint --strict deploy/helm/agentrag
      # Render the default (emptyDir model cache) and the Claude-only + shared-PVC variants.
      - run: helm template ci deploy/helm/agentrag > /dev/null
      - run: >-
          helm template ci deploy/helm/agentrag
          --set models.llm=claude-opus-5-5 --set models.fastModel=claude-haiku-4-5
          --set models.embeddingModel=BAAI/bge-small-en-v1.5 --set models.embeddingDimensions=384
          --set modelCache.persistence.enabled=true > /dev/null

  test:
    name: Tests (pytest + live DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentrag
          POSTGRES_PASSWORD: agentrag
          POSTGRES_DB: agentrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentrag"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      # App/worker + tests connect as the restricted role (created by migration 004);
      # Alembic connects as the owner via DATABASE_SYNC_URL.
      DATABASE_URL: postgresql+asyncpg://agentrag_app:agentrag_app@localhost:5432/agentrag
      DATABASE_SYNC_URL: postgresql://agentrag:agentrag@localhost:5432/agentrag
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # CPU torch first (sentence-transformers would otherwise pull the multi-GB CUDA build).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # Known-vulnerable Python dependencies (pins and everything they pull in) fail the build.
      - name: pip-audit (installed environment)
        run: pip install --upgrade pip setuptools pip-audit && pip-audit --progress-spinner off
      - name: Run migrations (creates agentrag_app role + FORCE RLS)
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v --cov=app

  e2e:
    name: End-to-end (docker compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # No real keys: generation goes to e2e/stub_llm.py, embeddings run locally (BGE-small).
      - run: cp e2e/e2e.env .env
      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f e2e/compose.e2e.yml up -d --build
      - name: Upload -> ingest -> query -> stream, and tenant isolation, through the frontend's nginx
        run: python3 e2e/run_e2e.py --base http://localhost:3001
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f e2e/compose.e2e.yml logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f e2e/compose.e2e.yml down -v
