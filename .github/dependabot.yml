# Weekly dependency PRs; CI (tests, audits, e2e) decides whether each is safe to merge.
# Minor/patch bumps are grouped per ecosystem to keep the PR count low; majors arrive one by one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 replaces tailwind.config.js with CSS-first config: a deliberate migration.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
