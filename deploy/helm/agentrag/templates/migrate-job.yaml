# Run Alembic migrations once per install/upgrade (not per backend replica) via a hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentrag.fullname" . }}-migrate
  labels:
    {{- include "agentrag.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "agentrag.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ include "agentrag.fullname" . }}-env
