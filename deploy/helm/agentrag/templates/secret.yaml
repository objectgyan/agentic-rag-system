apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentrag.fullname" . }}-env
  labels:
    {{- include "agentrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  TRUST_PROXY_HEADERS: {{ .Values.config.trustProxyHeaders | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  DATABASE_SYNC_URL: {{ .Values.config.databaseSyncUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.config.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.config.celeryResultBackend | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  COHERE_API_KEY: {{ .Values.secrets.cohereApiKey | quote }}
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prom_multiproc"
  WORKER_METRICS_PORT: "9100"
