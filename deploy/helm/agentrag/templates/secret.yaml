apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentrag.envSecret" . }}
  labels:
    {{- include "agentrag.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install hook, and hooks run before regular resources are
    # created — so the Secret it reads must be a (lower-weight) hook too, or the first install
    # hangs on a missing Secret. Side effects: `helm uninstall` leaves it behind (delete it by
    # hand), and it is named "-config" rather than chart 0.1.0's "-env": Helm deletes resources
    # that leave the release manifest, so reusing the old name would delete the Secret right
    # after the hook recreated it on the upgrade from 0.1.0.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  TRUST_PROXY_HEADERS: {{ .Values.config.trustProxyHeaders | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  DATABASE_SYNC_URL: {{ .Values.config.databaseSyncUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.config.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.config.celeryResultBackend | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  COHERE_API_KEY: {{ .Values.secrets.cohereApiKey | quote }}
  {{- with .Values.models }}
  {{- with .llm }}
  DEFAULT_LLM_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .fastModel }}
  DEFAULT_FAST_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .embeddingModel }}
  DEFAULT_EMBEDDING_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .embeddingDimensions }}
  DEFAULT_EMBEDDING_DIMENSIONS: {{ . | toString | quote }}
  {{- end }}
  {{- with .localRerankerModel }}
  LOCAL_RERANKER_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .endpoints }}
  LLM_ENDPOINTS: {{ toJson . | quote }}
  {{- end }}
  {{- end }}
  {{- range $name, $value := .Values.extraEnv }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
  HF_HOME: "/models"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prom_multiproc"
  WORKER_METRICS_PORT: "9100"
